stages:
  get_bdb_2024_data:
    # Download dataset from GitHub releases (~1-2 minutes)
    cmd: wget -q https://github.com/SumerSports/SportsTrackingTransformer/releases/download/data-v1.0/nfl-big-data-bowl-2024.tar.zst -O data/nfl-big-data-bowl-2024.tar.zst
    outs:
    - data/nfl-big-data-bowl-2024.tar.zst

  unzip_bdb_2024_data:
    # Decompress and extract dataset (~2-3 minutes)
    cmd: uv run zstd -d data/nfl-big-data-bowl-2024.tar.zst -c | tar -xf - -C data
    deps:
    - data/nfl-big-data-bowl-2024.tar.zst
    outs:
    - data/bdb_2024

  prep_data:
    # Prepare and split data into train/val/test sets (~10-20 minutes)
    cmd: uv run python src/prep_data.py
    deps:
    - src/prep_data.py
    - data/bdb_2024/
    outs:
    - data/split_prepped_data/

  precompute_datasets:
    # Pre-compute feature transforms for all splits. Builds the zoo, transformer, and
    # the shared temporal (RAW_FEATURES) datasets. Existing pickles are skipped on rerun,
    # so adding the temporal dataset does not rebuild zoo/transformer.
    cmd: uv run python src/datasets.py
    deps:
    - src/datasets.py
    - data/split_prepped_data/
    outs:
    - data/datasets/:
        persist: true

  train_zoo_models:
    # Train 12 zoo models (M32/M128/M512 × L1/L2/L4/L8)
    # Total: ~4-6 hours on GPU with --skip-existing flag (skips if checkpoints exist)
    cmd: uv run python src/train.py --model_type zoo --device 0 --skip-existing

    deps:
    - src/train.py
    - src/datasets.py
    - src/models.py
    - data/datasets/zoo/
    outs:
    - models/zoo/:
        persist: true
        cache: true

  train_transformer_models:
    # Train 12 transformer models (M32/M128/M512 × L1/L2/L4/L8)
    # Total: ~4-6 hours on GPU with --skip-existing flag (skips if checkpoints exist)
    cmd: uv run python src/train.py --model_type transformer --device 0 --skip-existing

    deps:
    - src/train.py
    - src/datasets.py
    - src/models.py
    - data/datasets/transformer
    outs:
    - models/transformer/:
        persist: true
        cache: true

  train_windowed_transformer_models:
    # Temporal control: flatten-T per-player encoder + attention.
    # Grid: M{32,128,512} x L{1,2,4,8} x W{5,10,15,20} = 48 configs.
    cmd: uv run python src/train.py --model_type windowed_transformer --device 0 --skip-existing
    deps:
    - src/train.py
    - src/datasets.py
    - src/models.py
    - data/datasets/temporal/
    outs:
    - models/windowed_transformer/:
        persist: true
        cache: true

  train_pure_gru_models:
    # Per-player GRU over time, no cross-player attention.
    cmd: uv run python src/train.py --model_type pure_gru --device 0 --skip-existing
    deps:
    - src/train.py
    - src/datasets.py
    - src/models.py
    - data/datasets/temporal/
    outs:
    - models/pure_gru/:
        persist: true
        cache: true

  train_hybrid_ts_models:
    # Hybrid time->space: per-player GRU encoder -> attention across players.
    cmd: uv run python src/train.py --model_type hybrid_ts --device 0 --skip-existing
    deps:
    - src/train.py
    - src/datasets.py
    - src/models.py
    - data/datasets/temporal/
    outs:
    - models/hybrid_ts/:
        persist: true
        cache: true

  train_hybrid_st_models:
    # Hybrid space->time: per-frame attention across players -> per-player GRU over time.
    cmd: uv run python src/train.py --model_type hybrid_st --device 0 --skip-existing
    deps:
    - src/train.py
    - src/datasets.py
    - src/models.py
    - data/datasets/temporal/
    outs:
    - models/hybrid_st/:
        persist: true
        cache: true

  pick_best_models:
    # Select best models based on validation loss (~1-2 minutes)
    cmd: uv run python src/pick_best_models.py

    deps:
    - src/pick_best_models.py
    - src/datasets.py
    - src/models.py
    - models/zoo/
    - models/transformer/
    - models/windowed_transformer/
    - models/pure_gru/
    - models/hybrid_ts/
    - models/hybrid_st/
    outs:
    - models/best_models/:
        cache: false
        persist: false

  generate_results:
    # Generate results summary and plots (~5-10 minutes)
    cmd: uv run python src/generate_results_summary.py

    deps:
    - src/generate_results_summary.py
    - src/models.py
    - models/best_models/
    - data/split_prepped_data/
    outs:
    - results/results.csv:
        cache: false
    - results/model_comparison.json:
        cache: false
    - results/frame_difference_plot.png:
        cache: false
artifacts:
  best_zoo_model:
    path: models/best_models/zoo/best_model.ckpt
    type: model
    desc: 'Best The Zoo Architecture Model'
    meta:
      framework: pytorch-lightning
  
  best_transformer_model:
    path: models/best_models/transformer/best_model.ckpt
    type: model
    desc: 'Best Transformer Architecture Model'
    meta:
      framework: pytorch-lightning